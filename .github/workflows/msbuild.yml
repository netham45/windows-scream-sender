# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write # Changed from 'read' to 'write' to allow creating releases

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Get short SHA
      id: short-sha
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create artifacts directory
      run: mkdir artifacts
      shell: cmd

    - name: Copy executable to artifacts directory
      run: copy x64\Release\ScreamSender.exe artifacts\
      shell: cmd

    - name: Copy install scripts to artifacts directory
      run: |
        copy install\install_task.bat artifacts\
        copy install\uninstall_task.bat artifacts\
      shell: cmd

    - name: Create ZIP archive
      run: Compress-Archive -Path artifacts\* -DestinationPath ScreamSender-${{ steps.short-sha.outputs.SHORT_SHA }}.zip
      shell: pwsh

    - name: Upload ScreamSender.exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreamSender
        path: x64\Release\ScreamSender.exe

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        tag_name: ${{ steps.short-sha.outputs.SHORT_SHA }}
        name: Release ${{ steps.short-sha.outputs.SHORT_SHA }}
        files: ScreamSender-${{ steps.short-sha.outputs.SHORT_SHA }}.zip
        draft: false
        prerelease: false
